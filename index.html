    <title>Новогодний HR бинго</title>

</head>
<body>
    <main class="container">
        <h1>Новогодний HR бинго </h1>
        <p class="subtitle">Выбери 5 запросов, которые чаще всего слышишь от коллег с приближением Нового года!</p>
        <div class="controls">
            <div id="selectionCounter" class="selection-counter">Выбрано 0/5</div>
            <button id="newGameBtn">Новая игра</button>
        </div>

        <section id="bingo" class="bingo-grid" aria-label="Бинго-сетка"></section>

        <footer class="footer">
            <small>Создано @HR_weekend</small>
        </footer>
    </main>

        <!-- Result modal -->
        <div id="resultModal" class="modal" aria-hidden="true">
            <div class="modal-backdrop"></div>
            <div class="modal-window" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
                <button class="modal-close" id="closeResultBtn" aria-label="Закрыть">✕</button>
                <div class="modal-body">
                    <div class="modal-image"><img id="resultImage" src="icons/star.svg" alt="Результат"/></div>
                    <h2 id="resultTitle">Результат</h2>
                    <p id="resultText">Здесь появится ваш уникальный результат в зависимости от выбранных картинок.</p>
                    <div class="modal-actions">
                        <button id="shareResultBtn"> Поделиться результатом</button>
                        <button id="closeBtn">Закрыть</button>
                    </div>
                </div>
            </div>
        </div>
